# 자동 생성: tools/make_runner.py (원본 Stock/.github/workflows/newmodel_v3_faketest.yml) — 직접 고치지 말 것
name: K-Stock v3 가짜 자료 시험

on:
  workflow_dispatch:


permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: bash --noprofile --norc -c "bash --noprofile --norc -eo pipefail {0} >> /tmp/run.log 2>&1"
jobs:

  fake-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: suoarman-cpu/Stock
          token: ${{ secrets.STOCK_TOKEN }}
      - name: 가짜 시험 브랜치 가져오기
        run: |
          git fetch --no-tags origin experiment/newmodel-faketest-v1
          git checkout --detach FETCH_HEAD
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 시험 의존성 설치
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-learn catboost xgboost
      - name: 가짜 자료 시험
        run: python -m unittest discover -s tools/newmodel/faketest -p "test_*.py" -v
      - name: 비공개 실행 기록 저장용 기본 브랜치 복귀
        run: git checkout -B main origin/main
      - name: 실행 기록 저장 (비공개 저장소에만)
        if: always()
        shell: bash
        run: |
          [ -f /tmp/run.log ] || exit 0
          mkdir -p results/logs
          tail -n 3000 /tmp/run.log | sed -E 's/(로그인 ID: ).*/\1***/' > "results/logs/${{ github.workflow }}-${{ github.job }}${{ strategy.job-index != '' && format('-{0}', strategy.job-index) || '' }}.log"
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add results/logs >/dev/null 2>&1 || exit 0
          git commit -qm "실행 기록" >/dev/null 2>&1 || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs --autostash origin main >/dev/null 2>&1; git push -q >/dev/null 2>&1 && break; sleep $((RANDOM % 10 + 3)); done
          echo "기록 저장 완료"
