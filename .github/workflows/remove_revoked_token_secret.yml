name: Remove revoked exposed token secret

on:
  push:
    paths:
      - .github/workflows/remove_revoked_token_secret.yml

permissions:
  actions: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the revoked STOCK_GITHUB_TOKEN secret
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/secrets/STOCK_GITHUB_TOKEN"
          status="$(curl -sS -o /tmp/delete-secret.json -w '%{http_code}' -X DELETE "$api" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28")"
          echo "Delete revoked secret HTTP status: $status"
          if [ "$status" != "204" ] && [ "$status" != "404" ]; then
            cat /tmp/delete-secret.json
            exit 1
          fi
          verify="$(curl -sS -o /tmp/verify-secret.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" "$api")"
          echo "Secret absence verification HTTP status: $verify"
          test "$verify" = "404"
          echo "VERIFIED: STOCK_GITHUB_TOKEN secret is absent. STOCK_GITHUB_TOKEN_ROTATED and STOCK_TOKEN were not changed."
