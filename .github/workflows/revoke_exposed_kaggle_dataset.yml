name: Revoke exposed Kaggle credential dataset

on:
  push:
    paths:
      - .github/workflows/revoke_exposed_kaggle_dataset.yml

permissions:
  contents: read

jobs:
  delete-exposed-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete exposed credential dataset
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${KAGGLE_API_TOKEN:-}" || {
            echo "::error::KAGGLE_API_TOKEN is missing"
            exit 1
          }
          python -m pip install --disable-pip-version-check kaggle==2.2.5 six==1.17.0
          kaggle datasets delete suoarman/stock-github-auth --yes
          echo "Deletion command completed for suoarman/stock-github-auth"
