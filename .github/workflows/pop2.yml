  compare:
    needs: [modela, modelc, modelt, modelt2, modelt3, factorpred]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
