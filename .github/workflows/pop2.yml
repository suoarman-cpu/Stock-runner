  factor:
    if: github.event.inputs.only != 'compare'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        job: ["ipca", "1", "2", "3", "4", "5", "6"]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: suoarman-cpu/Stock
          token: ${{ secrets.STOCK_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pandas numpy scipy lightgbm ipca && pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: 데이터 복원
        run: bash tools/cache_restore.sh
        env:
          GH_TOKEN: ${{ secrets.STOCK_TOKEN }}
      - name: 재무 점수 만들기
        run: python -u tools/chs_score.py score
      - name: 실행 (${{ matrix.job }})
        run: |
          if [ "${{ matrix.job }}" = "ipca" ]; then MODE=ipca timeout 170m python -u tools/ipca_cae.py; else MODE=caek KF=${{ matrix.job }} timeout 170m python -u tools/ipca_cae.py; fi
        env:
          GH_TOKEN: ${{ secrets.STOCK_TOKEN }}
          POP2: "1"
      - name: 실행 기록 저장 (비공개 저장소에만)
