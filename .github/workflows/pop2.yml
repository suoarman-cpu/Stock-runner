        env:
          GH_TOKEN: ${{ secrets.STOCK_TOKEN }}
      - name: 재무 점수 만들기
        run: python -u tools/chs_score.py score
      - name: 실행 (T (지표 22))
        run: timeout 170m python -u tools/ta_model.py || true
        env:
          GH_TOKEN: ${{ secrets.STOCK_TOKEN }}
          POP2: "1"
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add results/*_p2.* results/*_p2_* models/*_p2.txt || true
          git commit -m "새 학습(모집단 변경) T (지표 22)" || true
          for i in 1 2 3 4 5 6; do git pull --rebase -X theirs --autostash origin main && git push && break; sleep $((RANDOM % 20 + 5)); done
      - name: 실행 기록 저장 (비공개 저장소에만)
        if: always()
