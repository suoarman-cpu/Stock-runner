# 자동 생성: tools/make_runner.py (원본 Stock/.github/workflows/pop2.yml) — 직접 고치지 말 것
name: 새 학습(모집단 변경) 모형 병렬 학습·비교

on:
  workflow_dispatch:
    inputs:
      only:
        description: "all · compare"
        default: "all"


permissions:
  contents: write
  actions: write

defaults:

  run:
    shell: bash --noprofile --norc -c "bash --noprofile --norc -eo pipefail {0} >> /tmp/run.log 2>&1"

jobs:

  modela:
    if: github.event.inputs.only != 'compare'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          repository: suoarman-cpu/Stock
          token: ${{ secrets.STOCK_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pandas numpy scipy lightgbm
      - name: 데이터 복원
        run: bash tools/cache_restore.sh
        env:
          GH_TOKEN: ${{ secrets.STOCK_TOKEN }}
      - name: 재무 점수 만들기
        run: python -u tools/chs_score.py score
      - name: 실행 (모형 A 고정·워크포워드)
        run: timeout 170m python -u tools/stack_v2.py wf || true
        env:
          GH_TOKEN: ${{ secrets.STOCK_TOKEN }}
          POP2: "1"
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add results/*_p2.* results/*_p2_* models/*_p2.txt || true
          git commit -m "새 학습(모집단 변경) 모형 A 고정·워크포워드" || true
          for i in 1 2 3 4 5 6; do git pull --rebase -X theirs --autostash origin main && git push && break; sleep $((RANDOM % 20 + 5)); done
      - name: 실행 기록 저장 (비공개 저장소에만)
        if: always()
        shell: bash
        run: |
          [ -f /tmp/run.log ] || exit 0
          mkdir -p results/logs
          tail -n 3000 /tmp/run.log > "results/logs/${{ github.workflow }}-${{ github.job }}${{ strategy.job-index != '' && format('-{0}', strategy.job-index) || '' }}.log"
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add results/logs >/dev/null 2>&1 || exit 0
          git commit -qm "실행 기록" >/dev/null 2>&1 || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs --autostash origin main >/dev/null 2>&1; git push -q >/dev/null 2>&1 && break; sleep $((RANDOM % 10 + 3)); done
          echo "기록 저장 완료"

  modelc:
    if: github.event.inputs.only != 'compare'
    runs-on: ubuntu-latest
