name: Delete Kaggle notebook that consumed revoked credential dataset

on:
  push:
    paths:
      - .github/workflows/delete_exposed_credential_kaggle_kernel.yml

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete only the affected private Kaggle kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "STOP: Kaggle API credential missing; no deletion attempted."; exit 1; }
          python -m pip install --disable-pip-version-check kaggle
          kaggle kernels delete suoarman/direct-hit10-smoke -y
          if kaggle kernels status suoarman/direct-hit10-smoke >/tmp/kernel-status.txt 2>&1; then
            cat /tmp/kernel-status.txt
            echo "STOP: Kaggle kernel still resolves after deletion."
            exit 1
          fi
          echo "VERIFIED: affected Kaggle kernel no longer resolves."
