name: 예약 유지 (60일 규칙)

# 공개 저장소는 60일 동안 변경이 없으면 GitHub이 예약 실행을 멈춤 → 매주 한 줄 기록
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%MZ > .keepalive
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add .keepalive && git commit -qm "예약 유지" && git push -q
