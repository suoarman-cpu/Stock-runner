name: Remove revoked token secret using existing automation credential

on:
  push:
    paths:
      - .github/workflows/remove_revoked_token_secret_with_existing_pat.yml

permissions:
  contents: read

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Use existing STOCK_TOKEN only to remove the revoked STOCK_GITHUB_TOKEN secret
        env:
          EXISTING_AUTOMATION_TOKEN: ${{ secrets.STOCK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXISTING_AUTOMATION_TOKEN:-}" || { echo "STOP: STOCK_TOKEN absent; left unchanged."; exit 1; }
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/secrets/STOCK_GITHUB_TOKEN"
          status="$(curl -sS -o /tmp/remove-secret.json -w '%{http_code}' -X DELETE "$api" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $EXISTING_AUTOMATION_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28")"
          echo "Delete using existing automation credential HTTP status: $status"
          if [ "$status" != "204" ] && [ "$status" != "404" ]; then
            cat /tmp/remove-secret.json
            exit 1
          fi
          verify="$(curl -sS -o /tmp/verify-secret.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $EXISTING_AUTOMATION_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" "$api")"
          echo "Secret absence verification HTTP status: $verify"
          test "$verify" = "404"
          echo "VERIFIED: revoked STOCK_GITHUB_TOKEN secret absent. STOCK_TOKEN itself was not modified."
