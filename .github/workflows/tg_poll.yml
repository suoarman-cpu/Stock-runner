# 자동 생성: tools/make_runner.py (원본 Stock/.github/workflows/tg_poll.yml) — 직접 고치지 말 것
name: 텔레그램 메시지 확인

on:
  schedule:
    - cron: "13,43 0-13,23 * * *"   # 한국시간 08:13 ~ 22:43, 30분마다 (GitHub 사정으로 늦어질 수 있음)
  workflow_dispatch:


concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

defaults:

  run:
    shell: bash --noprofile --norc -c "bash --noprofile --norc -eo pipefail {0} >> /tmp/run.log 2>&1"

jobs:

  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: suoarman-cpu/Stock
          token: ${{ secrets.STOCK_TOKEN }}
      - name: 새 메시지 있는지 확인 (없으면 바로 종료)
        id: check
        env:
          TG: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          OFF=$(cat data/tg_offset.txt 2>/dev/null || echo 0)
          N=$(curl -s "https://api.telegram.org/bot${TG}/getUpdates?offset=${OFF}&timeout=0" \
              | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('result', [])))" || echo 0)
          echo "새 메시지: $N"
          echo "n=$N" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.check.outputs.n != '0'
        with:
          path: ~/.fonts
          key: nanum-fonts-v1
      - uses: actions/setup-python@v5
        if: steps.check.outputs.n != '0'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - if: steps.check.outputs.n != '0'
        run: |
          [ -n "$(ls ~/.fonts/NanumGothic*.ttf 2>/dev/null)" ] || { sudo apt-get install -y -qq fonts-nanum >/dev/null && mkdir -p ~/.fonts && cp /usr/share/fonts/truetype/nanum/NanumGothic*.ttf ~/.fonts/; }
          pip install -q -r requirements.txt
      - if: steps.check.outputs.n != '0'
        run: timeout 20m python -u tg_poll.py
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: 저장
        if: always() && steps.check.outputs.n != '0'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for f in data/tg_offset.txt data/watchlist.csv data/watch_state.json results/bot_last.txt; do [ -f "$f" ] && git add "$f"; done; true
          git commit -m "텔레그램 메시지 처리" || true
          git pull --rebase -X theirs --autostash origin main && git push || true
      - name: 실행 기록 저장 (비공개 저장소에만)
        if: always()
        shell: bash
        run: |
          [ -f /tmp/run.log ] || exit 0
          mkdir -p results/logs
          tail -n 3000 /tmp/run.log > "results/logs/${{ github.workflow }}-${{ github.job }}${{ strategy.job-index != '' && format('-{0}', strategy.job-index) || '' }}.log"
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add results/logs >/dev/null 2>&1 || exit 0
          git commit -qm "실행 기록" >/dev/null 2>&1 || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs --autostash origin main >/dev/null 2>&1; git push -q >/dev/null 2>&1 && break; sleep $((RANDOM % 10 + 3)); done
          echo "기록 저장 완료"
