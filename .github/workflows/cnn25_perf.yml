# 자동 생성: tools/make_runner.py (원본 Stock/.github/workflows/cnn25_perf.yml) — 직접 고치지 말 것
name: CNN 25 서버 성능 추가 측정 (56·112일, 동시 실행) — 본 학습 아님

on:
  workflow_dispatch:


permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: bash --noprofile --norc -c "bash --noprofile --norc -eo pipefail {0} >> /tmp/run.log 2>&1"

jobs:

  single:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        L: [56, 112]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: suoarman-cpu/Stock
          token: ${{ secrets.STOCK_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pandas numpy scipy psutil && pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: 데이터 복원
        run: bash tools/cache_restore.sh
        env:
          GH_TOKEN: ${{ secrets.STOCK_TOKEN }}
      - name: 측정 (그림 ${{ matrix.L }}일)
        run: python -u tools/cnn25_perf.py single --L ${{ matrix.L }} --n 15
        env:
          GH_TOKEN: ${{ secrets.STOCK_TOKEN }}
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add results/cnn25/perf_single_L*.json || true
          git commit -m "CNN 25 서버 성능 추가 측정 (단독)" || true
          for i in 1 2 3 4 5 6; do git pull --rebase -X theirs --autostash origin main && git push && break; sleep $((RANDOM % 20 + 5)); done
      - name: 실행 기록 저장 (비공개 저장소에만)
        if: always()
        shell: bash
        run: |
          [ -f /tmp/run.log ] || exit 0
          mkdir -p results/logs
          tail -n 3000 /tmp/run.log > "results/logs/${{ github.workflow }}-${{ github.job }}${{ strategy.job-index != '' && format('-{0}', strategy.job-index) || '' }}.log"
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add results/logs >/dev/null 2>&1 || exit 0
          git commit -qm "실행 기록" >/dev/null 2>&1 || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs --autostash origin main >/dev/null 2>&1; git push -q >/dev/null 2>&1 && break; sleep $((RANDOM % 10 + 3)); done
          echo "기록 저장 완료"

  parallel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { L: 15, procs: 2 }
          - { L: 15, procs: 4 }
          - { L: 56, procs: 2 }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: suoarman-cpu/Stock
          token: ${{ secrets.STOCK_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pandas numpy scipy psutil && pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: 데이터 복원
        run: bash tools/cache_restore.sh
        env:
          GH_TOKEN: ${{ secrets.STOCK_TOKEN }}
      - name: 동시 측정 (그림 ${{ matrix.L }}일 × ${{ matrix.procs }}개)
        run: python -u tools/cnn25_perf.py parallel --L ${{ matrix.L }} --procs ${{ matrix.procs }} --n 15
        env:
          GH_TOKEN: ${{ secrets.STOCK_TOKEN }}
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add results/cnn25/perf_parallel_L*.json || true
          git commit -m "CNN 25 서버 성능 추가 측정 (동시)" || true
          for i in 1 2 3 4 5 6; do git pull --rebase -X theirs --autostash origin main && git push && break; sleep $((RANDOM % 20 + 5)); done
      - name: 실행 기록 저장 (비공개 저장소에만)
        if: always()
        shell: bash
        run: |
          [ -f /tmp/run.log ] || exit 0
          mkdir -p results/logs
          tail -n 3000 /tmp/run.log > "results/logs/${{ github.workflow }}-${{ github.job }}${{ strategy.job-index != '' && format('-{0}', strategy.job-index) || '' }}.log"
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add results/logs >/dev/null 2>&1 || exit 0
          git commit -qm "실행 기록" >/dev/null 2>&1 || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs --autostash origin main >/dev/null 2>&1; git push -q >/dev/null 2>&1 && break; sleep $((RANDOM % 10 + 3)); done
          echo "기록 저장 완료"
