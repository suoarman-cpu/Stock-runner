# 자동 생성: tools/make_runner.py (원본 Stock/.github/workflows/fast.yml) — 직접 고치지 말 것
name: 여러 대로 나눠 빠르게 모으기

# 연기금·10년 수급(날짜별)을 서버 3대씩 나눠 동시에 수집 → 합치기 → 빠진 날 있으면 바로 다시
on:
  workflow_dispatch:


concurrency:
  group: fast-collect
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: bash --noprofile --norc -c "bash --noprofile --norc -eo pipefail {0} >> /tmp/run.log 2>&1"

jobs:

  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        kind: [pension, flows]
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: suoarman-cpu/Stock
          token: ${{ secrets.STOCK_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -U pykrx requests pandas
      - name: 모으기 (조각 ${{ matrix.shard }})
        run: |
          python -u -c "from pykrx import stock" || { echo "거래소 로그인 안 됨 → 멈춤"; exit 1; }
          timeout 40m python -u fast_collect.py ${{ matrix.kind }} ${{ matrix.shard }} 6
        env:
          GH_TOKEN: ${{ secrets.STOCK_TOKEN }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
      - name: 실행 기록 저장 (비공개 저장소에만)
        if: always()
        shell: bash
        run: |
          [ -f /tmp/run.log ] || exit 0
          mkdir -p results/logs
          tail -n 3000 /tmp/run.log > "results/logs/${{ github.workflow }}-${{ github.job }}${{ strategy.job-index != '' && format('-{0}', strategy.job-index) || '' }}.log"
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add results/logs >/dev/null 2>&1 || exit 0
          git commit -qm "실행 기록" >/dev/null 2>&1 || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs --autostash origin main >/dev/null 2>&1; git push -q >/dev/null 2>&1 && break; sleep $((RANDOM % 10 + 3)); done
          echo "기록 저장 완료"

  merge:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: suoarman-cpu/Stock
          token: ${{ secrets.STOCK_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -U pykrx requests pandas
      - name: 합치고 빠진 날 확인
        id: m
        run: |
          a=$(python -u fast_collect.py pension merge 6 | tail -1)
          b=$(python -u fast_collect.py flows merge 6 | tail -1)
          echo "$a $b"
          if [ "$a" = "done=1" ] && [ "$b" = "done=1" ]; then echo "all=1" >> $GITHUB_OUTPUT; fi
        env:
          GH_TOKEN: ${{ secrets.STOCK_TOKEN }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
      - name: 빠진 날 있으면 바로 다시
        if: steps.m.outputs.all != '1' && needs.collect.result != 'failure'
        run: GH_TOKEN=${{ github.token }} gh workflow run fast.yml -R suoarman-cpu/stock-runner && echo "다시 시작"
        env:
          GH_TOKEN: ${{ secrets.STOCK_TOKEN }}
      - name: 다 모였으면 10년 수집(합치기·검증) 이어서
        if: steps.m.outputs.all == '1'
        run: GH_TOKEN=${{ github.token }} gh workflow run long.yml -R suoarman-cpu/stock-runner && echo "10년 수집 이어서 시작"
        env:
          GH_TOKEN: ${{ secrets.STOCK_TOKEN }}
      - name: 실행 기록 저장 (비공개 저장소에만)
        if: always()
        shell: bash
        run: |
          [ -f /tmp/run.log ] || exit 0
          mkdir -p results/logs
          tail -n 3000 /tmp/run.log > "results/logs/${{ github.workflow }}-${{ github.job }}${{ strategy.job-index != '' && format('-{0}', strategy.job-index) || '' }}.log"
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add results/logs >/dev/null 2>&1 || exit 0
          git commit -qm "실행 기록" >/dev/null 2>&1 || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs --autostash origin main >/dev/null 2>&1; git push -q >/dev/null 2>&1 && break; sleep $((RANDOM % 10 + 3)); done
          echo "기록 저장 완료"
