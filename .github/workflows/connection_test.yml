# 자동 생성: tools/make_runner.py (원본 Stock/.github/workflows/connection_test.yml) — 직접 고치지 말 것
name: 연결 테스트

on:
  workflow_dispatch:
  push:
    paths:
      - connection_test.py
      - .github/workflows/connection_test.yml


permissions:
  contents: write
  actions: write

defaults:

  run:
    shell: bash --noprofile --norc -c "bash --noprofile --norc -eo pipefail {0} >> /tmp/run.log 2>&1"

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: suoarman-cpu/Stock
          token: ${{ secrets.STOCK_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -U pykrx requests
      - run: python connection_test.py
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: 결과 파일 저장
        if: always()
        run: |
          [ -f test_result.txt ] || echo "결과 파일 없음 (스크립트가 중간에 멈춤)" > test_result.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add test_result.txt
          git commit -m "연결 테스트 결과" || true
          git push
      - name: 실행 기록 저장 (비공개 저장소에만)
        if: always()
        shell: bash
        run: |
          [ -f /tmp/run.log ] || exit 0
          mkdir -p results/logs
          tail -n 3000 /tmp/run.log > "results/logs/${{ github.workflow }}-${{ github.job }}${{ strategy.job-index != '' && format('-{0}', strategy.job-index) || '' }}.log"
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add results/logs >/dev/null 2>&1 || exit 0
          git commit -qm "실행 기록" >/dev/null 2>&1 || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs --autostash origin main >/dev/null 2>&1; git push -q >/dev/null 2>&1 && break; sleep $((RANDOM % 10 + 3)); done
          echo "기록 저장 완료"
