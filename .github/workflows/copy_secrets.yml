# 자동 생성: tools/make_runner.py (원본 Stock/.github/workflows/copy_secrets.yml) — 직접 고치지 말 것
name: 비밀값 복사 (Stock → Stock-runner, 한 번만)

# 이 저장소의 비밀값을 공개 실행 저장소로 암호화한 채 복사 — 값은 화면·기록에 절대 출력하지 않음
on:
  workflow_dispatch:


permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: bash --noprofile --norc -c "bash --noprofile --norc -eo pipefail {0} >> /tmp/run.log 2>&1"

jobs:

  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: pip install -q pynacl requests >/dev/null 2>&1
      - name: 복사
        env:
          PAT: ${{ secrets.STOCK_TOKEN }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import base64, os, requests
          from nacl import encoding, public
          R = "https://api.github.com/repos/suoarman-cpu/stock-runner/actions/secrets"
          H = {"Authorization": "Bearer " + os.environ["PAT"], "Accept": "application/vnd.github+json"}
          k = requests.get(R + "/public-key", headers=H, timeout=20)
          if k.status_code != 200:
              raise SystemExit(f"공개 저장소 열쇠 받기 실패 ({k.status_code}) — 토큰에 Stock-runner 저장소와 Secrets 쓰기 권한이 있는지 확인")
          k = k.json()
          box = public.SealedBox(public.PublicKey(k["key"].encode(), encoding.Base64Encoder()))
          for n in ("KRX_ID", "KRX_PW", "DART_API_KEY", "TELEGRAM_TOKEN", "TELEGRAM_CHAT_ID"):
              v = os.environ.get(n, "")
              if not v:
                  print(f"{n}: 이 저장소에 값이 없음 — 건너뜀"); continue
              enc = base64.b64encode(box.encrypt(v.encode())).decode()
              r = requests.put(f"{R}/{n}", headers=H, json={"encrypted_value": enc, "key_id": k["key_id"]}, timeout=20)
              print(f"{n}: {'복사됨' if r.status_code in (201, 204) else '실패 ' + str(r.status_code)}")
          PY
      - name: 실행 기록 저장 (비공개 저장소에만)
        if: always()
        shell: bash
        run: |
          [ -f /tmp/run.log ] || exit 0
          mkdir -p results/logs
          tail -n 3000 /tmp/run.log > "results/logs/${{ github.workflow }}-${{ github.job }}${{ strategy.job-index != '' && format('-{0}', strategy.job-index) || '' }}.log"
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add results/logs >/dev/null 2>&1 || exit 0
          git commit -qm "실행 기록" >/dev/null 2>&1 || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs --autostash origin main >/dev/null 2>&1; git push -q >/dev/null 2>&1 && break; sleep $((RANDOM % 10 + 3)); done
          echo "기록 저장 완료"
