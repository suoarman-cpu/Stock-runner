# 자동 생성: tools/make_runner.py (원본 Stock/.github/workflows/kaggle_direct_hit10_smoke.yml) — 직접 고치지 말 것
name: direct_hit10 Kaggle 오프라인 Smoke

on:
  workflow_dispatch:


concurrency:
  group: direct-hit10-kaggle-offline
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: bash --noprofile --norc -c "bash --noprofile --norc -eo pipefail {0} >> /tmp/run.log 2>&1"

jobs:

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          repository: suoarman-cpu/Stock
          token: \${{ secrets.STOCK_TOKEN }}
          ref: experiment/kaggle-direct-hit10-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kaggle CLI 고정 버전 설치
        run: python -m pip install --disable-pip-version-check kaggle==2.2.5

      - name: 자동화 코드 구문 검사
        run: python -m py_compile kaggle/direct_hit10/runner_build.py

      - name: 데이터·코드 전달 및 오프라인 Smoke 실행
        env:
          KAGGLE_API_TOKEN: \${{ secrets.KAGGLE_API_TOKEN }}
          STOCK_TOKEN: \${{ secrets.STOCK_TOKEN }}
        run: python -u kaggle/direct_hit10/runner_build.py
      - name: 실행 기록 저장 (비공개 저장소에만)
        if: always()
        shell: bash
        run: |
          [ -f /tmp/run.log ] || exit 0
          mkdir -p results/logs
          tail -n 3000 /tmp/run.log | sed -E 's/(로그인 ID: ).*/\\1***/' > "results/logs/\${{ github.workflow }}-\${{ github.job }}-\${{ github.run_id }}\${{ strategy.job-index != '' && format('-{0}', strategy.job-index) || '' }}.log"
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add results/logs >/dev/null 2>&1 || exit 0
          git commit -qm "실행 기록" >/dev/null 2>&1 || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs --autostash origin main >/dev/null 2>&1; git push -q >/dev/null 2>&1 && break; sleep $((RANDOM % 10 + 3)); done
          echo "기록 저장 완료"
