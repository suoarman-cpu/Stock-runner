# 자동 생성: tools/make_runner.py (원본 Stock/.github/workflows/kaggle_direct_hit10_smoke.yml) — 직접 고치지 말 것
name: direct_hit10 Kaggle 오프라인 Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".kaggle-smoke-trigger"


concurrency:
  group: direct-hit10-kaggle-offline
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          repository: suoarman-cpu/Stock
          token: ${{ secrets.STOCK_GITHUB_TOKEN }}
          ref: experiment/kaggle-direct-hit10-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kaggle CLI 고정 버전 설치
        run: python -m pip install --disable-pip-version-check kaggle==2.2.5 six==1.17.0

      - name: 자동화 코드 구문 검사
        run: python -m py_compile kaggle/direct_hit10/runner_build.py

      - name: 데이터·코드 전달 및 오프라인 Smoke 실행
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          STOCK_TOKEN: ${{ secrets.STOCK_GITHUB_TOKEN }}
        run: python -u kaggle/direct_hit10/runner_build.py
