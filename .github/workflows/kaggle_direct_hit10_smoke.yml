name: direct_hit10 Kaggle 제한 Smoke 시험

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kaggle_direct_hit10_smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kaggle CLI 설치
        run: python -m pip install --disable-pip-version-check kaggle six

      - name: 비공개 Stock 브랜치에서 노트북 가져오기 및 Smoke 전용으로 안전화
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          STOCK_GITHUB_TOKEN: ${{ secrets.STOCK_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "::error::KAGGLE_API_TOKEN Secret 누락"; exit 1; }
          test -n "${STOCK_GITHUB_TOKEN:-}" || { echo "::error::STOCK_GITHUB_TOKEN Secret 누락"; exit 1; }
          mkdir -p /tmp/direct-hit10
          python - <<'PY'
          import os, requests, base64, json, pathlib
          token=os.environ["STOCK_GITHUB_TOKEN"]
          url="https://api.github.com/repos/suoarman-cpu/Stock/contents/kaggle/direct_hit10/notebook.ipynb"
          h={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          r=requests.get(url,headers=h,params={"ref":"experiment/kaggle-direct-hit10-v1"},timeout=60)
          r.raise_for_status()
          nb=json.loads(base64.b64decode(r.json()["content"]))
          cells=nb.get("cells",[])
          # 전체 학습 셀은 절대 Kaggle에 전송하지 않음. 0~4번까지만 남겨 Smoke까지만 실행.
          if len(cells)<5: raise RuntimeError(f"노트북 셀 수가 예상과 다름: {len(cells)}")
          sources=["".join(c.get("source",[])) for c in cells]
          if not any("--smoke" in s for s in sources): raise RuntimeError("Smoke 실행 셀을 찾지 못함")
          if not any("--budget-hours 11" in s for s in sources): raise RuntimeError("전체 학습 셀 존재 확인 실패 — 안전 중단")
          nb["cells"]=cells[:5]
          # Kaggle CLI로 push한 노트북에는 UI의 Add-ons > Secrets가 자동 연결되지 않음.
          # GitHub PAT는 별도 비공개 Kaggle Dataset input에서 읽도록 변경.
          for cell in nb["cells"]:
              if cell.get("cell_type") == "markdown":
                  cell["source"] = [s.replace(
                      "Kaggle Notebook의 Add-ons/Secrets에 `STOCK_GITHUB_TOKEN` 이름으로 GitHub Fine-grained PAT를 등록합니다.",
                      "GitHub 인증은 비공개 Kaggle Dataset stock-github-auth의 credential.txt에서 읽습니다."
                  ) for s in cell.get("source", [])]
              if cell.get("cell_type") == "code":
                  src = "".join(cell.get("source", []))
                  src = src.replace("from kaggle_secrets import UserSecretsClient\\n", "")
                  src = src.replace(
                      "TOKEN = UserSecretsClient().get_secret('STOCK_GITHUB_TOKEN')",
                      "TOKEN = open('/kaggle/input/stock-github-auth/credential.txt', encoding='utf-8').read().strip()"
                  )
                  cell["source"] = src.splitlines(keepends=True)
          out=pathlib.Path("/tmp/direct-hit10")
          code="notebook40fd7c933b.ipynb"
          (out/code).write_text(json.dumps(nb,ensure_ascii=False))
          meta={
            "id":"suoarman/direct-hit10-smoke",
            "title":"direct-hit10-smoke",
            "code_file":code,
            "language":"python",
            "kernel_type":"notebook",
            "is_private":True,
            "enable_gpu":False,
            "enable_internet":True,
            "dataset_sources":["suoarman/stock-github-auth"]
          }
          (out/"kernel-metadata.json").write_text(json.dumps(meta,ensure_ascii=False,indent=2))
          print("Smoke 전용 노트북 생성 완료: 기존 5개 셀만 포함, 전체 학습 셀 제외")
          PY

      - name: GitHub 읽기 토큰을 비공개 Kaggle Dataset으로 전달
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          STOCK_GITHUB_TOKEN: ${{ secrets.STOCK_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${STOCK_GITHUB_TOKEN:-}" || { echo "::error::STOCK_GITHUB_TOKEN Secret 누락"; exit 1; }
          mkdir -p /tmp/stock-github-auth
          printf '%s' "$STOCK_GITHUB_TOKEN" > /tmp/stock-github-auth/credential.txt
          chmod 600 /tmp/stock-github-auth/credential.txt
          cat > /tmp/stock-github-auth/dataset-metadata.json <<'JSON'
          {
            "title": "Stock GitHub Auth",
            "id": "suoarman/stock-github-auth",
            "licenses": [{"name": "CC0-1.0"}]
          }
          JSON
          if kaggle datasets status suoarman/stock-github-auth >/dev/null 2>&1; then
            kaggle datasets version -p /tmp/stock-github-auth -m "Refresh private read-only access credential" -q -t
          else
            kaggle datasets create -p /tmp/stock-github-auth -q -t
          fi
          # Dataset creation/version processing is asynchronous. Do not push a kernel
          # until Kaggle confirms that credential.txt is actually available as input.
          ready=0
          for i in $(seq 1 60); do
            listing="$(kaggle datasets files suoarman/stock-github-auth 2>&1 || true)"
            if echo "$listing" | grep -Fq "credential.txt"; then
              echo "Private credential dataset is ready."
              ready=1
              break
            fi
            echo "[$i/60] Waiting for private credential dataset publication..."
            sleep 10
          done
          test "$ready" -eq 1 || { echo "::error::Private Kaggle credential dataset did not become available"; exit 1; }
          rm -f /tmp/stock-github-auth/credential.txt

      - name: Kaggle에 Smoke 버전 제출
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: kaggle kernels push -p /tmp/direct-hit10

      - name: Kaggle 실행 완료 대기
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ref="suoarman/direct-hit10-smoke"
          for i in $(seq 1 150); do
            status="$(kaggle kernels status "$ref" 2>&1 || true)"
            echo "[$i/150] $status"
            if echo "$status" | grep -Eqi 'COMPLETE|SUCCESS'; then
              exit 0
            fi
            if echo "$status" | grep -Eqi 'ERROR|FAILED|CANCELLED'; then
              echo "::error::Kaggle 실행 실패 — 진단 출력 수집"
              mkdir -p /tmp/direct-hit10-failure
              kaggle kernels output "$ref" -p /tmp/direct-hit10-failure || true
              python - <<'PY'
          import pathlib,json
          root=pathlib.Path("/tmp/direct-hit10-failure")
          files=[p for p in root.rglob("*") if p.is_file()]
          print("실패 시 다운로드 파일:", [str(p.relative_to(root)) for p in files][:100])
          for p in files:
              if p.suffix.lower() in (".txt",".log",".json",".ipynb"):
                  try:
                      obj=json.loads(p.read_text(errors="replace")) if p.suffix.lower() in (".json",".ipynb") else None
                      if isinstance(obj,dict) and "cells" in obj:
                          for ci,cell in enumerate(obj.get("cells",[])):
                              for out in cell.get("outputs",[]):
                                  txt="".join(out.get("text",[])) if isinstance(out.get("text"),list) else str(out.get("text",""))
                                  if txt: print(f"[{p.name} cell {ci}] {txt[:4000]}")
                                  for item in out.get("data",{}).values():
                                      if isinstance(item,list): print(f"[{p.name} cell {ci}] {''.join(item)[:4000]}")
                      elif obj is not None:
                          print(f"[{p.name}] {json.dumps(obj,ensure_ascii=False)[:4000]}")
                      elif p.suffix.lower()==".log":
                          try:
                              entries=json.loads(p.read_text(errors="replace"))
                              for entry in entries:
                                  data=entry.get("data","")
                                  print(f"[{p.name} {entry.get('stream_name')}] {data[:20000]}")
                          except Exception:
                              print(f"[{p.name}] {p.read_text(errors='replace')[:20000]}")
                      else:
                          print(f"[{p.name}] {p.read_text(errors='replace')[:20000]}")
                  except Exception as e:
                      print(f"[{p.name}] 진단 읽기 실패: {e}")
          PY
              exit 1
            fi
            sleep 60
          done
          echo "::error::Kaggle 실행 대기 시간 초과"
          exit 1

      - name: Smoke 결과 가져오기 및 요약 표시
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/direct-hit10-output
          kaggle kernels output suoarman/direct-hit10-smoke -p /tmp/direct-hit10-output
          python - <<'PY'
          import pathlib,json
          root=pathlib.Path("/tmp/direct-hit10-output")
          files=list(root.rglob("run_summary.json"))
          if not files:
              print("다운로드 파일:", [str(p.relative_to(root)) for p in root.rglob("*") if p.is_file()][:80])
              raise SystemExit("run_summary.json이 없어 Smoke 결과를 확정할 수 없습니다.")
          data=json.loads(files[0].read_text())
          safe={k:data.get(k) for k in ("상태","사유","smoke","총경과초","최대메모리MB","cpu시간초","threads","단계","연도","모델파일수")}
          print("===== direct_hit10 SMOKE SAFE SUMMARY =====")
          print(json.dumps(safe,ensure_ascii=False,indent=2)[:5000])
          PY
