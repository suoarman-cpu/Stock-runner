name: direct_hit10 Kaggle 제한 Smoke 시험

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kaggle CLI 설치
        run: python -m pip install --disable-pip-version-check kaggle six

      - name: 비공개 Stock 브랜치에서 노트북 가져오기 및 Smoke 전용으로 안전화
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          STOCK_GITHUB_TOKEN: ${{ secrets.STOCK_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "::error::KAGGLE_API_TOKEN Secret 누락"; exit 1; }
          test -n "${STOCK_GITHUB_TOKEN:-}" || { echo "::error::STOCK_GITHUB_TOKEN Secret 누락"; exit 1; }
          mkdir -p /tmp/direct-hit10
          python - <<'PY'
          import os, requests, base64, json, pathlib
          token=os.environ["STOCK_GITHUB_TOKEN"]
          url="https://api.github.com/repos/suoarman-cpu/Stock/contents/kaggle/direct_hit10/notebook.ipynb"
          h={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          r=requests.get(url,headers=h,params={"ref":"experiment/kaggle-direct-hit10-v1"},timeout=60)
          r.raise_for_status()
          nb=json.loads(base64.b64decode(r.json()["content"]))
          cells=nb.get("cells",[])
          # 전체 학습 셀은 절대 Kaggle에 전송하지 않음. 0~4번까지만 남겨 Smoke까지만 실행.
          if len(cells)<5: raise RuntimeError(f"노트북 셀 수가 예상과 다름: {len(cells)}")
          sources=["".join(c.get("source",[])) for c in cells]
          if not any("--smoke" in s for s in sources): raise RuntimeError("Smoke 실행 셀을 찾지 못함")
          if not any("--budget-hours 11" in s for s in sources): raise RuntimeError("전체 학습 셀 존재 확인 실패 — 안전 중단")
          nb["cells"]=cells[:5]
          out=pathlib.Path("/tmp/direct-hit10")
          code="notebook40fd7c933b.ipynb"
          (out/code).write_text(json.dumps(nb,ensure_ascii=False))
          meta={
            "id":"suoarman/notebook40fd7c933b",
            "title":"direct_hit10 제한 Smoke 시험",
            "code_file":code,
            "language":"python",
            "kernel_type":"notebook",
            "is_private":True,
            "enable_gpu":False,
            "enable_internet":True
          }
          (out/"kernel-metadata.json").write_text(json.dumps(meta,ensure_ascii=False,indent=2))
          print("Smoke 전용 노트북 생성 완료: 기존 5개 셀만 포함, 전체 학습 셀 제외")
          PY

      - name: Kaggle에 Smoke 버전 제출
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: kaggle kernels push -p /tmp/direct-hit10

      - name: Kaggle 실행 완료 대기
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ref="suoarman/notebook40fd7c933b"
          for i in $(seq 1 150); do
            status="$(kaggle kernels status "$ref" 2>&1 || true)"
            echo "[$i/150] $status"
            if echo "$status" | grep -Eqi 'COMPLETE|SUCCESS'; then
              exit 0
            fi
            if echo "$status" | grep -Eqi 'ERROR|FAILED|CANCELLED'; then
              echo "::error::Kaggle 실행 실패"
              exit 1
            fi
            sleep 60
          done
          echo "::error::Kaggle 실행 대기 시간 초과"
          exit 1

      - name: Smoke 결과 가져오기 및 요약 표시
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/direct-hit10-output
          kaggle kernels output suoarman/notebook40fd7c933b -p /tmp/direct-hit10-output
          python - <<'PY'
          import pathlib,json
          root=pathlib.Path("/tmp/direct-hit10-output")
          files=list(root.rglob("run_summary.json"))
          if not files:
              print("다운로드 파일:", [str(p.relative_to(root)) for p in root.rglob("*") if p.is_file()][:80])
              raise SystemExit("run_summary.json이 없어 Smoke 결과를 확정할 수 없습니다.")
          data=json.loads(files[0].read_text())
          safe={k:data.get(k) for k in ("상태","사유","smoke","총경과초","최대메모리MB","cpu시간초","threads","단계","연도","모델파일수")}
          print("===== direct_hit10 SMOKE SAFE SUMMARY =====")
          print(json.dumps(safe,ensure_ascii=False,indent=2)[:5000])
          PY
