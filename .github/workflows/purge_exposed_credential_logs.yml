name: Purge historical logs of exposed credential workflow

on:
  push:
    paths:
      - .github/workflows/purge_exposed_credential_logs.yml

permissions:
  actions: write

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete historical logs for every direct_hit10 Kaggle workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          ids="45995045560 45987894218 45957984913 45957431195 45957114003 45956805424 45956487480 45956191089 45955596086 45955299259 45955102455 45954781072 45954491591 45954197553 45953739109 45945628750 45945021925 45944645482 45944389096 45942182736 45942132235"
          failed=0
          for id in $ids; do
            status="$(curl -sS -o /tmp/purge-log.json -w '%{http_code}' -X DELETE \
              "https://api.github.com/repos/$repo/actions/runs/$id/logs" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28")"
            case "$status" in
              204|404) echo "run=$id logs_deleted_or_absent HTTP=$status" ;;
              *) echo "run=$id log_delete_failed HTTP=$status"; cat /tmp/purge-log.json; failed=1 ;;
            esac
          done
          test "$failed" -eq 0
          echo "Historical log purge pass finished."
